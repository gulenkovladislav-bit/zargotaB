<!doctype html><meta charset="utf-8"><base href="../"><title>Журнал Евана · перевірка</title><link rel="stylesheet" href="story-journal.css"><style>body{margin:0;background:#080c0b}#view{position:relative;height:100vh;overflow:hidden}#art{width:100%;height:100%;object-fit:contain}#note{position:absolute;bottom:0;left:0;right:0;height:21vh;background:#0b161cba;color:#eddfbc;pointer-events:none;font:24px Georgia;padding:15px;box-sizing:border-box}#locale{position:absolute;top:12px;right:12px;z-index:5;padding:10px}</style><div id="view"><img id="art"><div id="note">Журнал на столі можна відкрити / Журнал на столе можно открыть</div></div><button id="locale">RU / UK</button><script src="story-image-secrets.js"></script><script src="story-journal.js"></script><script>let locale='uk';window.ZargotaI18n={getLocale:()=>locale};localeButton=document.getElementById('locale');localeButton.onclick=()=>{locale=locale==='uk'?'ru':'uk';stop();stop=ZargotaStoryJournal.mount(view,art,page,true)};const page={"id": "evan-finale-results", "kind": "choice", "editorSceneId": "scene-evan-results", "title": "Пришли ответы", "titleUk": "Надійшли відповіді", "x": 8200, "y": 3160, "slides": [{"speaker": "speaker-1789814989758", "text": "Пришли ответы из университета. К сожалению, в оба корпуса тебя не приняли.", "textUk": "Надійшли відповіді з університету. На жаль, до обох корпусів тебе не прийняли.", "emotion": "emotion-1789816132394", "showPortrait": true, "portraitOverride": false, "image": "", "journal": null}, {"speaker": "speaker-1789852672609", "text": "В оба?.. А что написали про работу?", "textUk": "До обох?.. А що написали про роботу?", "emotion": "emotion-1789852989293", "showPortrait": true, "portraitOverride": false, "image": "", "journal": null}, {"speaker": "speaker-1789799703305", "text": "Ты очень старался. Мы это видели. Не надо сейчас себя мучить.", "textUk": "Ти дуже старався. Ми це бачили. Не треба зараз себе мучити.", "emotion": "emotion-1789816051716", "showPortrait": true, "portraitOverride": false, "image": "", "journal": null}], "links": [{"id": "evan-finale-link-53", "to": "evan-finale-letters", "label": "Можно посмотреть ответы?", "labelUk": "Можна подивитися відповіді?"}, {"id": "evan-finale-link-54", "to": "evan-finale-guild-result", "label": "А что ответили из гильдии?", "labelUk": "А що відповіли з гільдії?", "requires": "evan-finale-guild-applied"}], "firstShowPortrait": false, "speaker": "evan-abbey-narrator", "text": "За месяц листы успели обрасти исправлениями. Сегодня родители зовут Эвана поговорить об ответах.", "textUk": "За місяць аркуші встигли обрости виправленнями. Сьогодні батьки кличуть Евана поговорити про відповіді.", "emotion": "", "showPortrait": false, "portraitOverride": false, "image": "assets/stories/Evan/inspections/finale/engineering-journal-desk-v1.png", "imageFit": "contain", "imageMotion": {"type": "none"}, "journal": {"title": "Рабочий журнал Евана", "titleUk": "Робочий журнал Евана", "x": 22, "y": 48, "width": 28, "height": 27, "pages": [{"title": "01 · С чего я начал", "titleUk": "01 · З чого я почав", "text": "Тележка должна менять путь, если переставить штырьки на барабане. Не разбирать её каждый раз, а менять порядок движений. Старые рисунки оставляю: иначе потом решу, что всё сразу понимал.\n\nВ папке было три команды: вперёд, поворот, стой. На бумаге они послушные. Но рисунок не объясняет, откуда берётся усилие и что произойдёт, если колесо упрётся в камень.\n\nГлавный вопрос: барабан задаёт порядок, но сам по себе ничего не приводит в движение. Не путать управление с источником силы.", "textUk": "Візок має змінювати шлях, якщо переставити кілочки на барабані. Не розбирати його щоразу, а змінювати порядок рухів. Старі малюнки залишаю: інакше потім вирішу, що все відразу розумів.\n\nУ теці було три команди: уперед, поворот, стій. На папері вони слухняні. Але малюнок не пояснює, звідки береться зусилля і що станеться, якщо колесо впирається в камінь.\n\nГоловне питання: барабан задає порядок, але сам собою нічого не приводить у рух. Не плутати керування з джерелом сили.", "image": "assets/stories/Evan/inspections/draft-folder-v1.png"}, {"title": "02 · После разговора у станка", "titleUk": "02 · Після розмови біля верстата", "text": "Я всё время представлял колёса. Преподаватель показал другую последовательность: подать заготовку, закрепить, опустить сверло. Если поменять местами последние действия, заготовку вырвет.\n\nЗначит, можно сначала обойтись без тележки. Собрать барабан и два рычага. Один поднимается, другой ждёт. Потом наоборот. Важно не то, насколько большая получилась вещь, а повторяет ли она нужное движение.\n\nДля первого образца — только ручка. Крутить медленно самому. Не подключать ни колесо, ни груз, пока не вижу, где всё заедает.\n\nЗаписать не только удачный вариант. Ошибки тоже взять с собой, когда снова пойду к преподавателю.", "textUk": "Я весь час уявляв колеса. Викладач показав іншу послідовність: подати заготовку, закріпити, опустити свердло. Якщо поміняти місцями останні дії, заготовку вирве.\n\nОтже, можна спершу обійтися без візка. Зібрати барабан і два важелі. Один підіймається, другий чекає. Потім навпаки. Важливо не те, яка велика вийшла річ, а чи повторює вона потрібний рух.\n\nДля першого зразка — лише ручка. Крутити повільно самому. Не під’єднувати ні колесо, ні вантаж, поки не бачу, де все заїдає.\n\nЗаписати не лише вдалий варіант. Помилки теж узяти із собою, коли знову піду до викладача."}, {"title": "03 · Разметка барабана", "titleUk": "03 · Розмітка барабана", "text": "Пробная разметка: разделить окружность на двенадцать равных частей.\n\n360° ÷ 12 = 30° между отметками.\n\nЕсли вручную сделать один оборот за двенадцать счётов, на один промежуток придётся один счёт. Это только удобство проверки: рука не держит точную скорость.\n\nПервый ряд штырьков касается рычага А, второй — рычага Б. Поставить отметку начала оборота, чтобы не начинать каждый раз с другого места.\n\nПопробовать сначала большой промежуток между срабатываниями. Не ставить штырьки теснее ради красивого рисунка. Рычаг должен успеть вернуться. Время возврата ещё измерить.", "textUk": "Пробна розмітка: поділити коло на дванадцять рівних частин.\n\n360° ÷ 12 = 30° між позначками.\n\nЯкщо вручну зробити один оберт за дванадцять відліків, на один проміжок припаде один відлік. Це лише зручність перевірки: рука не тримає точної швидкості.\n\nПерший ряд кілочків торкається важеля А, другий — важеля Б. Поставити позначку початку оберту, щоб не починати щоразу з іншого місця.\n\nСпробувати спочатку великий проміжок між спрацьовуваннями. Не ставити кілочки щільніше заради гарного малюнка. Важіль має встигнути повернутися. Час повернення ще виміряти."}, {"title": "04 · Усилие и остановка", "titleUk": "04 · Зусилля й зупинка", "text": "На отдельном рисунке: от опоры до одного конца рычага две меры, до другого — одна. В идеальном случае длинное плечо позволяет поднимать вдвое больший груз на коротком. Но оно проходит вдвое больший путь. Ничего не появляется даром.\n\nДля проверки: 1 груз × 2 меры = 2 груза × 1 мера. Без учёта трения и веса самого рычага. На дереве результат будет хуже.\n\nНе пытаться исправить заедание более сильным вращением. Сначала остановить ручку и посмотреть на след касания.\n\nВопрос преподавателю: как прервать передачу движения, если привод уже не рука? Свободный ход? Выводимая из зацепления деталь? Пока не решил.", "textUk": "На окремому малюнку: від опори до одного кінця важеля дві міри, до іншого — одна. В ідеальному випадку довге плече дозволяє підіймати вдвічі більший вантаж на короткому. Але воно проходить удвічі більший шлях. Нічого не з’являється задарма.\n\nДля перевірки: 1 вантаж × 2 міри = 2 вантажі × 1 міра. Без урахування тертя й ваги самого важеля. На дереві результат буде гіршим.\n\nНе намагатися виправити заїдання сильнішим обертанням. Спершу зупинити ручку й подивитися на слід дотику.\n\nПитання викладачеві: як перервати передачу руху, якщо приводом уже буде не рука? Вільний хід? Деталь, яку можна вивести із зачеплення? Поки не вирішив."}, {"title": "05 · Что пришлось переделать", "titleUk": "05 · Що довелося переробити", "text": "Первая сборка. Барабан крутился отдельно, но после установки второго рычага ручка стала идти тяжелее. Сначала решил, что виноваты штырьки. Проверил по одному рычагу: один всё равно цеплял боком.\n\nПередвинул опору. Стало свободнее. Запомнить: если ошибка появилась после новой детали, это ещё не значит, что виновата именно она.\n\nОдин штырёк вылезал из отверстия. Не стал сразу заливать всё клеем: тогда уже не переставишь. Подогнал другой, старый оставил рядом для сравнения.\n\nДесять медленных оборотов без груза — только первая проба. Это не доказательство надёжности. Проверить после перерыва, потом с небольшой нагрузкой. Записать отдельно, где ручку приходится подталкивать.", "textUk": "Перше складання. Барабан крутився окремо, але після встановлення другого важеля ручка стала йти важче. Спершу вирішив, що винні кілочки. Перевірив по одному важелю: один усе одно чіплявся боком.\n\nПересунув опору. Стало вільніше. Запам’ятати: якщо помилка з’явилася після нової деталі, це ще не означає, що винна саме вона.\n\nОдин кілочок вилазив з отвору. Не став одразу заливати все клеєм: тоді вже не переставиш. Підігнав інший, старий залишив поруч для порівняння.\n\nДесять повільних обертів без вантажу — лише перша проба. Це не доказ надійності. Перевірити після перерви, потім із невеликим навантаженням. Записати окремо, де ручку доводиться підштовхувати."}, {"title": "06 · Что я хочу спросить", "titleUk": "06 · Що я хочу запитати", "text": "Как сделать, чтобы рычаг возвращался уверенно, но не бил по барабану? Как проверить износ отверстий, если штырьки часто переставлять? Какая часть должна уступить первой при заклинивании, чтобы не сломалось всё остальное?\n\nОтдельно: нельзя выдавать одинаковое число оборотов за одинаковую работу. Пока нет нагрузки, я проверяю только порядок движений.\n\nВзять на следующую встречу: старые рисунки тележки, этот журнал, образец и неудачный штырёк. Показать, что изменил, а не только то, что получилось.\n\nНе забыть спросить про зажим той студентки. Три месяца на одну деталь. Теперь это уже не кажется странным.\n\nЯ ещё не знаю, как сделать целый станок. Но уже знаю, что хочу проверить завтра.", "textUk": "Як зробити, щоб важіль повертався впевнено, але не бив по барабану? Як перевірити зношування отворів, якщо кілочки часто переставляти? Яка частина має поступитися першою під час заклинювання, щоб не зламалося все інше?\n\nОкремо: не можна видавати однакову кількість обертів за однакову роботу. Поки немає навантаження, я перевіряю лише порядок рухів.\n\nУзяти на наступну зустріч: старі малюнки візка, цей журнал, зразок і невдалий кілочок. Показати, що змінив, а не тільки те, що вдалося.\n\nНе забути спитати про затискач тієї студентки. Три місяці на одну деталь. Тепер це вже не здається дивним.\n\nЯ ще не знаю, як зробити цілий верстат. Але вже знаю, що хочу перевірити завтра."}]}};art.src=page.image;let stop=ZargotaStoryJournal.mount(view,art,page,true);</script>
